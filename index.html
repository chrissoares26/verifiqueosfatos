<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/normalize.css">
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#FAFAFA">
  <script>
    // Applies the saved theme before first paint. Light is the default.
    function setTheme(dark) {
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name=theme-color]').content = dark ? '#0A0A0A' : '#FAFAFA';
    }
    try {
      setTheme(localStorage.getItem('theme') === 'dark');
    } catch {}
  </script>

  <title>Verifique os Fatos</title>
<meta name="description" content="Acompanhe a checagem em tempo real das falas e propostas dos candidatos a presidente no debate eleitoral da Globo.">
<link rel="canonical" href="https://verifiqueosfatos.com/">

<!-- Open Graph (WhatsApp, Facebook, LinkedIn, Telegram, Discord) -->
<meta property="og:locale" content="pt_BR">
<meta property="og:url" content="https://verifiqueosfatos.com/">
<meta property="og:title" content="Verifique os Fatos">
<meta property="og:description" content="Acompanhe a checagem em tempo real das falas e propostas dos candidatos a presidente no debate eleitoral da Globo.">
<meta property="og:image" content="https://verifiqueosfatos.com/verifique-os-fatos.png">
<meta property="og:image:secure_url" content="https://verifiqueosfatos.com/verifique-os-fatos.png">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Verifique os Fatos">
</head>
<body>
  <div class="layout">
    <header class="top">
      <span class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      </span>
      <div>
        <h1>Verifique os Fatos</h1>
        <p class="sub">Checagem em tempo real<span class="long"> das falas dos candidatos a presidente</span></p>
      </div>
      <button type="button" class="theme" aria-label="Modo escuro" aria-pressed="false">
        <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <main></main>

    <footer class="foot">
      <p>Um projeto feito pela comunidade para a comunidade.</p>
    </footer>
  </div>

  <script>
    const labels = {
      // name
      n: {
        1: 'Lula',
        2: 'Flávio',
      },
      // checks
      c: {
        1: 'Verdadeiro',
        2: 'Falso',
        3: 'Parcial'
      },
      // images
      i: {
        1: 'lula.webp',
        2: 'flavio.webp',
      }
    };

    // Keep state in memory
    let currentPosts = [];

    // Drop malformed items so one bad entry can't break rendering for everyone
    function isValid(item) {
      return !!item && !!labels.n[item.n] && !!labels.c[item.c]
        && typeof item.t === 'string' && typeof item.v === 'string';
    }

    function getLS() {
      try {
        const data = JSON.parse(localStorage.getItem('data'));
        return Array.isArray(data) ? data.filter(isValid) : [];
      } catch {
        return [];
      }
    }

    function createCardHTML(item) {
      return `
        <article class="card">
          <header>
            <img src="/${labels.i[item.n]}" alt="" width="56" height="56" decoding="async" loading="lazy">
            <h2>${labels.n[item.n]}</h2>
            <span class="badge" data-c="${item.c}">${labels.c[item.c]}</span>
          </header>
          <div class="said">
            <span class="label">Disse que</span>
            <p>${escapeHTML(item.t)}</p>
          </div>
          <span class="label">Verificação</span>
          <p>${escapeHTML(item.v)}</p>
        </article>
      `;
    }

    function render(newData, containerSelector = 'main') {
      const items = newData || getLS();

      if (!items || !items.length) {
        document.querySelector(containerSelector).innerHTML = '';
      }

      // 1. Skip completely if the content hasn't changed at all
      if (JSON.stringify(items) === JSON.stringify(currentPosts)) {
        return;
      }

      const mainTarget = document.querySelector(containerSelector);
      if (!mainTarget) return;

      // Ensure the .article-grid wrapper exists
      let grid = mainTarget.querySelector('.article-grid');
      if (!grid) {
        grid = document.createElement('div');
        grid.className = 'article-grid';
        mainTarget.appendChild(grid);
      }

      // 2. If memory is empty (initial page load), render everything
      if (currentPosts.length === 0) {
        grid.innerHTML = items.map(createCardHTML).join('');
      } else {
        // 3. Otherwise, append/prepend ONLY the new items to avoid re-rendering existing DOM nodes
        const newItems = items.slice(currentPosts.length);
        if (newItems.length > 0) {
          const fragment = document.createDocumentFragment();
          
          newItems.forEach(item => {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = createCardHTML(item).trim();
            fragment.appendChild(tempDiv.firstChild);
          });

          // Change to prepend() if newest posts should appear at the top
          grid.appendChild(fragment); 
        }
      }

      // Update in-memory reference
      currentPosts = items;
      
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function generateAlphanumeric(length = 6) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }
    
    const DELAY = 15000;
    const NOW = new Date();
    const INTERVAL = DELAY + NOW.getSeconds();    
    const URI_POSTS_JSON = '/posts.json';

    function update() {
      fetch(`${URI_POSTS_JSON}?v=${generateAlphanumeric()}`)
        .then(r => r.json())
        .then(data => {
          if (!Array.isArray(data)) return;
          const items = data.filter(isValid);
          // Render before saving: blocked storage must not stop the update
          render(items);
          try {
            localStorage.setItem('data', JSON.stringify(items));
          } catch {}
        })
        .catch(console.error);
    }

    const themeButton = document.querySelector('.theme');
    themeButton.setAttribute('aria-pressed', document.documentElement.dataset.theme === 'dark');
    themeButton.onclick = () => {
      const dark = themeButton.getAttribute('aria-pressed') !== 'true';
      setTheme(dark);
      themeButton.setAttribute('aria-pressed', dark);
      try {
        localStorage.setItem('theme', dark ? 'dark' : 'light');
      } catch {}
    };

    // Initial render from localStorage, then perform first fetch
    render();
    update();
    setInterval(update, INTERVAL);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
